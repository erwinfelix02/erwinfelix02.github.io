<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team CV Cards</title>
    <!-- Make sure style.css is in the SAME folder as this index.html file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1 class="page-title">Team Curriculum Vitae</h1>
        
        <div class="card-grid">
            
            <!-- Person 1 -->
            <article class="cv-card">
                <h2>Alex Johnson</h2>
                <!-- Replace href with actual link to Person 1's CV -->
                <a href="https://example.com/cv/alex-johnson.pdf" target="_blank" class="cv-button">View CV</a>
            </article>

            <!-- Person 2 -->
            <article class="cv-card">
                <h2>Maria Santos</h2>
                <!-- Replace href with actual link to Person 2's CV -->
                <a href="https://example.com/cv/maria-santos.pdf" target="_blank" class="cv-button">View CV</a>
            </article>

            <!-- Person 3 -->
            <article class="cv-card">
                <h2>David Smith</h2>
                <!-- Replace href with actual link to Person 3's CV -->
                <a href="https://example.com/cv/david-smith.pdf" target="_blank" class="cv-button">View CV</a>
            </article>

        </div>
    </main>

</body>
</html>
